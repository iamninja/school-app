<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#19191B" media="(prefers-color-scheme: dark)" />
    <title>Modus — Χωρίς σύνδεση</title>
    <!--
      Shown by public/sw.js when a page can't load because the phone is
      offline. Fully self-contained (inline styles, inline logo): nothing
      else can be fetched while offline.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f4ef;
        --fg: #2b2b2e;
        --muted: #6b6a66;
        --brand: #f2b705;
        --card: #ffffff;
        --border: #e4e0d6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19191b;
          --fg: #f2f1ee;
          --muted: #a3a19c;
          --card: #222225;
          --border: #34343a;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        text-align: center;
      }
      svg { width: 56px; height: auto; margin-bottom: 20px; }
      h1 { margin: 0 0 8px; font-size: 1.25rem; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
      button {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: var(--fg);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 97 90" aria-hidden="true">
        <circle cx="48.249" cy="24" r="12" fill="currentColor" />
        <circle cx="24" cy="66" r="12" fill="currentColor" />
        <circle cx="72.497" cy="66" r="12" fill="#f2b705" />
      </svg>
      <h1>Δεν υπάρχει σύνδεση στο διαδίκτυο</h1>
      <p>Ελέγξτε το Wi-Fi ή τα δεδομένα κινητής και δοκιμάστε ξανά.</p>
      <button type="button" onclick="location.reload()">Δοκιμάστε ξανά</button>
    </main>
  </body>
</html>
