# Checks every pull request (and every push to main): types, lint and the
# two test suites - the same commands as before a push on a PC:
#   npx tsc --noEmit -p .   npx eslint .   npm test -- --run   npm run test:unit
# The RLS tests (npm run test:rls) need a local Supabase stack in Docker,
# so they stay a manual step (tests/rls/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the run for the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Types
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npx vitest run

      - name: Server-action tests
        run: npx vitest run -c vitest.unit.config.ts
