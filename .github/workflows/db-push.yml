# Push database migrations to Supabase from GitHub (also from the phone:
# GitHub app -> Actions -> "Push database migrations" -> Run workflow).
#
# Same as `npm run db:push` on a PC (CLAUDE.md: schema changes only ever go
# through tracked migrations + db push), just run here.
#
# One-time setup (repository Settings):
#   Secrets and variables -> Actions -> New repository secret
#     SUPABASE_ACCESS_TOKEN   a personal access token from
#                             supabase.com/dashboard/account/tokens
#   Environments -> "dev" and "prod" (exact names), in each a secret
#     SUPABASE_DB_PASSWORD    that project's database password
#   Optional: on "prod", Required reviewers -> yourself, so a prod push
#   waits for one more tap ("Review deployments -> Approve").
name: Push database migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which database
        type: choice
        options: [dev, prod]
        default: dev
      ref:
        description: Branch with the migration files (e.g. main or a feature branch)
        type: string
        default: main
      dry_run:
        description: Only list what would be applied
        type: boolean
        default: false

permissions:
  contents: read

# Never two pushes to the same database at once.
concurrency:
  group: db-push-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  push:
    name: ${{ inputs.dry_run && 'Dry run' || 'Push' }} to ${{ inputs.target }} from ${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Project refs aren't secret (they're in every request the app makes).
      PROJECT_REF: ${{ inputs.target == 'prod' && 'daeehagpcboyfhbfoqgu' || 'nwyzfxyxklxpccnfwnab' }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN (repository secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD (secret of the '${{ inputs.target }}' environment)"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing - see the setup notes at the top of .github/workflows/db-push.yml"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Supabase CLI version pinned in package.json (devDependency).
      - name: Install the Supabase CLI
        run: npm ci --no-audit --no-fund

      - name: Migrations before
        run: npx supabase migration list --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run
        if: inputs.dry_run
        run: npx supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Push
        if: ${{ !inputs.dry_run }}
        run: npx supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Migrations after
        if: ${{ !inputs.dry_run }}
        run: |
          npx supabase migration list --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" | tee migrations.txt
          {
            echo "### ${{ inputs.target }}: pushed from \`${{ inputs.ref }}\`"
            echo '```'
            tail -n 15 migrations.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
